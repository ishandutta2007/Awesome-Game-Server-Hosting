<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/><stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-15px) translateX(10px);opacity:.8}}@keyframes gridScan{0%{transform:translateY(-300px)}}@keyframes dashMove{0%{stroke-dashoffset:100}}.bg-bg{fill:url(#bg-grad)}.glow-circle{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.particle-1{animation:floatParticle 4s ease-in-out infinite}.particle-2{animation:floatParticle 7s ease-in-out infinite 1s}.particle-3{animation:floatParticle 5s ease-in-out infinite 2s}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-size:42px;font-weight:800;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-size:18px;font-weight:400;fill:#cbd5e1}.badge-text{font-size:13px;font-weight:600;fill:#e2e8f0}.animated-line{stroke-dasharray:10 15;animation:dashMove 20s linear infinite}</style><rect width="1000" height="300" class="bg-bg" rx="16"/><circ