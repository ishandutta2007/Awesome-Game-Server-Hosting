<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes gridScan {
      0% { transform: translateY(-300px); }
      100% { transform: translateY(300px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .bg-bg { fill: url(#bg-grad); }
    .glow-circle { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 5s ease-in-out infinite 2s; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 400;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .animated-line {
      stroke-dasharray: 10 15;
      animation: dashMove 20s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1000" height="300" rx="16" class="bg-bg"/>

  <!-- Background Dynamic Glowing Orbs (Behind text foreground) -->
  <circle cx="150" cy="80" r="120" fill="#6366f1" opacity="0.25" filter="url(#glow)" class="glow-circle"/>
  <circle cx="850" cy="220" r="140" fill="#ec4899" opacity="0.2" filter="url(#glow)" class="glow-circle" style="animation-delay: -3s;"/>

  <!-- Subtle Network Grid Lines (Dynamic / Background Layer) -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
  </g>

  <!-- Animated Tech Connection Lines -->
  <path d="M 100,240 Q 250,180 400,240 T 700,200 T 950,260" fill="none" stroke="url(#primary-grad)" stroke-width="2" opacity="0.4" class="animated-line"/>

  <!-- Floating particles in background layer -->
  <circle cx="220" cy="120" r="4" fill="#a855f7" class="particle-1"/>
  <circle cx="780" cy="90" r="6" fill="#38bdf8" class="particle-2"/>
  <circle cx="880" cy="160" r="3" fill="#f43f5e" class="particle-3"/>
  <circle cx="120" cy="210" r="5" fill="#818cf8" class="particle-2"/>

  <!-- Decorative Feature Cards (Positioned safely away from text foreground) -->
  <g transform="translate(680, 50)" opacity="0.85">
    <rect width="270" height="70" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <circle cx="30" cy="35" r="16" fill="#6366f1" opacity="0.3"/>
    <!-- Vector Lightning Bolt Icon -->
    <path d="M 31 23 L 23 35 H 30 L 29 47 L 37 35 H 30 Z" fill="#818cf8"/>
    <text x="60" y="33" class="badge-text">Low Latency Fleets</text>
    <text x="60" y="52" fill="#94a3b8" font-size="11" font-family="sans-serif">Edge &amp; Multi-Cloud Scaling</text>
  </g>

  <g transform="translate(680, 140)" opacity="0.85">
    <rect width="270" height="70" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <circle cx="30" cy="35" r="16" fill="#a855f7" opacity="0.3"/>
    <!-- Vector Game Controller Icon -->
    <g transform="translate(19, 25) scale(0.9)" fill="#c084fc">
      <path d="M21.5 2H3.5C1.57 2 0 3.57 0 5.5v11C0 18.43 1.57 20 3.5 20h1.75l2.2-4h9.1l2.2 4h1.75c1.93 0 3.5-1.57 3.5-3.5v-11C24 3.57 22.43 2 20.5 2zM7 11.5H5.5V13H4v-1.5H2.5V10H4V8.5h1.5V10H7v1.5zm11.5 1c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-4c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
    </g>
    <text x="60" y="33" class="badge-text">Agones &amp; Pterodactyl</text>
    <text x="60" y="52" fill="#94a3b8" font-size="11" font-family="sans-serif">Open Source Orchestration</text>
  </g>

  <!-- FOREGROUND LAYER: Title and Subtitle (Unobstructed & Crystal Clear) -->
  <g transform="translate(60, 0)">
    <!-- Pill Category Badge -->
    <g transform="translate(0, 55)">
      <rect width="230" height="28" rx="14" fill="url(#primary-grad)" opacity="0.9"/>
      <!-- Controller Icon inside badge -->
      <path d="M17 19.5h-1v1h-1v-1h-1v-1h1v-1h1v1h1v1zm8 0c-.28 0-.5-.22-.5-.5s.22-.5.5-.5.5.22.5.5-.22.5-.5.5zm1-2.5c-.28 0-.5-.22-.5-.5s.22-.5.5-.5.5.22.5.5-.22.5-.5.5z" fill="#ffffff" transform="translate(0, -6)"/>
      <text x="115" y="19" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" font-family="sans-serif" letter-spacing="0.5">MULTIPLAYER ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title-text">Awesome Game Server Hosting</text>
    
    <!-- Title Underline Accent -->
    <rect x="0" y="142" width="480" height="4" rx="2" fill="url(#primary-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle-text">Curated Dedicated Servers, Cloud Orchestration &amp; Fleet Management</text>
    <text x="0" y="208" fill="#94a3b8" font-size="14" font-family="sans-serif">SaaS Platforms • Agones • Pterodactyl • LinuxGSM • Kubernetes Operators</text>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="294" width="1000" height="6" fill="url(#primary-grad)"/>
</svg>
